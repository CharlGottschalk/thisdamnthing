name: Documentation issue
description: Report an error or something unclear in the docs.
title: '[Docs]: '
labels:
- documentation
body:
- type: markdown
  attributes:
    value: 'Search existing issues before opening a new one. Reports are public: leave out passwords,
      API keys, private workspace notes, and personal data. For private reports or help by email, contact
      support@usetdt.com.'
- type: input
  id: page
  attributes:
    label: Affected page or guide
    description: Provide the URL, guide title, or local documentation filename.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What is missing or unclear?
    description: Describe the incorrect information or where you got stuck.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
    description: Explain what would make the instructions more useful, if you know.
  validations:
    required: false
- type: input
  id: version
  attributes:
    label: ThisDamnThing version
    description: For installed documentation, include the ThisDamnThing version if known.
  validations:
    required: false
