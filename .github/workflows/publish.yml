name: Build and publish Python package

on:
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE'
      - 'src/thisdamnthing/**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check release identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['name'] != 'thisdamnthing':
              raise SystemExit('Unexpected distribution name')
          if os.environ['EVENT_NAME'] == 'release':
              if os.environ['RELEASE_PRERELEASE'] != 'false':
                  raise SystemExit('Only stable releases may publish to PyPI')
              if os.environ['RELEASE_TAG'] != 'v' + project['version']:
                  raise SystemExit('Release tag must be v followed by the package version')
          PY
      - name: Install build tools
        run: python -m pip install 'build==1.6.1' 'setuptools==84.0.0' 'wheel==0.48.0' 'twine==7.0.0'
      - name: Build and check distributions
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*
      - name: Verify installed wheel
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          wheel, = Path('dist').glob('*.whl')
          with tempfile.TemporaryDirectory() as scratch:
              root = Path(scratch)
              env = os.environ.copy()
              env.pop('PYTHONPATH', None)
              subprocess.run([sys.executable, '-m', 'venv', str(root / 'venv')], check=True)
              python = root / 'venv' / 'bin' / 'python'
              subprocess.run([str(python), '-m', 'pip', 'install', '--no-index', '--no-deps', str(wheel.resolve())], check=True)
              cli = root / 'venv' / 'bin' / 'tdt'
              commands = [
                  ['--version'], ['--help'],
                  ['init', str(root / 'workspace'), '--agent', 'none'],
                  ['--workspace', str(root / 'workspace'), 'doctor'],
                  ['--workspace', str(root / 'workspace'), 'stack', 'list'],
                  ['--workspace', str(root / 'workspace'), 'project', 'list'],
              ]
              for args in commands:
                  subprocess.run([str(cli), *args], cwd=root, env=env, check=True)
          PY
      - name: Record artifact checksums
        run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-checksums
          path: SHA256SUMS
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/thisdamnthing/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
