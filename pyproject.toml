[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "thisdamnthing"
version = "0.1.3"
description = "A local knowledge workspace with optional stacks"
authors = [{name = "Charl Gottschalk"}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://usetdt.com"
Documentation = "https://usetdt.com/docs"
Repository = "https://github.com/CharlGottschalk/thisdamnthing"
Issues = "https://github.com/CharlGottschalk/thisdamnthing/issues"

[project.scripts]
tdt = "thisdamnthing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["thisdamnthing*"]

[tool.setuptools.package-data]
thisdamnthing = ["resources/workspace/*.md", "resources/docs/*.md", "resources/harness/*.md",
         "resources/harness/hooks/*.py", "resources/harness/contracts/*.md",
         "resources/harness/skills/*/SKILL.md", "resources/ui/*", "resources/marketplace/*.json"]
